name: Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Step 1: Code Quality, Linting & Build
  # ==========================================
  validate-and-build:
    name: 🔍 Lint & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Clean Dependencies
        run: npm ci

      - name: 🧹 Run ESLint Quality Check
        run: npm run lint

      - name: 🏗️ Compile Production Bundle
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: dist/
          retention-days: 7

  # ==========================================
  # Step 2: Multi-Stage Docker Image Build
  # ==========================================
  docker-build:
    name: 🐳 Docker Container Build & Verify
    needs: validate-and-build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub (if secrets present)
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🚀 Build & Validate Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' && env.DOCKERHUB_TOKEN != '' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'nilesh2033parmar' }}/devops-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Step 3: Deployment Summary Report
  # ==========================================
  deploy-summary:
    name: 📊 Pipeline Health & Summary
    needs: [validate-and-build, docker-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 📋 Generate Step Summary
        run: |
          echo "### 🚀 Deployment Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ All quality gates, builds & Docker container checks passed." >> $GITHUB_STEP_SUMMARY
          echo "- **Target Hosting Options**: Ready for Vercel, Render & AWS EC2." >> $GITHUB_STEP_SUMMARY
